### Scripts ###
.activate_mise: &activate_mise
  - mise install
  - eval "$(mise env)"
 
.update_nuget_source_ro: &update_nuget_source_ro
  - dotnet nuget update source JFrogNuGetProxy --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text

.update_nuget_source_rw: &update_nuget_source_rw
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_RW_JFrog -p $NuGet_PW_RW_JFrog --store-password-in-clear-text

.rule_tag: &rule_tag
  if: "$CI_COMMIT_TAG"

.rule_default_branch: &rule_default_branch
  if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

.rule_mr: &rule_mr
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rule_web: &rule_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rules: &rules
  - *rule_tag
  - *rule_default_branch
  - *rule_mr
  - *rule_web

.rules_manual: &rules_manual
  - <<: *rule_tag
    when: manual
    allow_failure: true
  - <<: *rule_default_branch
    when: manual
    allow_failure: true
  - <<: *rule_mr
    when: manual
    allow_failure: true
  - <<: *rule_web
    when: manual
    allow_failure: true

.install_npm_packages: &install_npm_packages
  - npm install
  
### Defaults ###
variables:
  IMAGE_NAME: registry.gitlab.com/vicione-oss/tooling/base-image:vicione-latest
  RUNNER_TAG: saas-linux-small-amd64
  # Shared path prefix for tagged Pages deployments and their release links.
  RELEASE_PAGES_PATH_PREFIX: release-$CI_COMMIT_TAG

stages:
  - build
  - test
  - pack
  - push
  - publish
  - release

### CI Components ###
include:
  ### Version calculation
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/version/version-calc@v1.2.0
  ### Renovate configuration validation
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/renovate/configuration-validation@v1.0.1
    inputs:
      rules: *rules
      tags:
        - ${RUNNER_TAG}
  ### Restore
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-restore@v2.7.1
    inputs:
      image: ${IMAGE_NAME}
      rules: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
        - *install_npm_packages
      tags:
        - ${RUNNER_TAG}
  ### Build
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-build@v2.7.1
    inputs:
      image: ${IMAGE_NAME}
      rules: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
        - 'echo "Version: ${Version:-notAssigned}"'
      tags:
        - ${RUNNER_TAG}
  ### Test 
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-test@v2.7.1
    inputs:
      name: "dotnet Test"
      image: ${IMAGE_NAME}
      rules: *rules
      before_script:
        - cat /etc/os-release || true
        - apt-get update
        - apt-get install -y libgdiplus
        - *activate_mise
        - *update_nuget_source_ro
      tags:
        - ${RUNNER_TAG}
      coverage: true
  ### Pack
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-pack@v2.7.1
    inputs:
      image: ${IMAGE_NAME}
      rules: *rules_manual
      before_script:
        - *activate_mise
        - 'echo "PackageVersion: ${PackageVersion:-notAssigned}"'
        - 'export PREVENT_BUILD_PROJECT_REFERENCES_WHEN_TENEKON_IS_USED=true'
      tags:
        - ${RUNNER_TAG}
  ### Push
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-nuget-push@v2.7.1
    inputs:
      stage: "push"
      image: ${IMAGE_NAME}
      sources:
        - "JFrogViciOne"
      filename_pattern: "*/src/*"
      rules: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_rw
      tags:
        - ${RUNNER_TAG}

### GitLab Pages
Publish Pages:
  stage: publish
  image: ${IMAGE_NAME}
  needs: ["dotnet Test"]
  pages:
    publish: public
    path_prefix: $PAGES_PATH_PREFIX
    expire_in: $PAGES_EXPIRE_IN
  before_script:
    - *activate_mise
    - *update_nuget_source_ro
    - *install_npm_packages
  script:
    - apt update && apt install -y gzip brotli
    - |
      if [ -n "$PAGES_PATH_PREFIX" ]; then
        BASE_PATH="/${PAGES_PATH_PREFIX}/"
      else
        BASE_PATH="/"
      fi
    - dotnet publish samples/ViciOne.Ui.MonochromeIcons.Samples.BlazorWebAssemblyStandaloneApp -c Release -o artifacts
    - sed -i "s|<base href=\"/\" />|<base href=\"${BASE_PATH}\" />|" artifacts/wwwroot/index.html
    - gzip -9 -c artifacts/wwwroot/index.html > artifacts/wwwroot/index.html.gz
    - brotli -f -q 11 artifacts/wwwroot/index.html -o artifacts/wwwroot/index.html.br
    - mkdir public
    - cp -R artifacts/wwwroot/* public
    - echo "Publish Pages on \"https://monochromeicons.pages.vicione.dev${BASE_PATH}\""
  rules:
    # Publish tagged releases permanently under their version path.
    - if: "$CI_COMMIT_TAG"
      variables:
        PAGES_PATH_PREFIX: $RELEASE_PAGES_PATH_PREFIX
        PAGES_EXPIRE_IN: never
    # Publish the default branch (master) permanently as the main Pages deployment.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        PAGES_PATH_PREFIX: ""
        PAGES_EXPIRE_IN: never
    # Provide a temporary, manually triggered preview for merge requests.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
      variables:
        PAGES_PATH_PREFIX: branch-$CI_COMMIT_REF_SLUG
        PAGES_EXPIRE_IN: 1 week

### GitLab Release
Create Release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  script:
    - echo "Create release for ${CI_COMMIT_TAG}"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Version $VERSION"
    description: "See `CHANGELOG.md`"
    assets:
      links:
        - name: "Open sample application"
          url: "https://monochromeicons.pages.vicione.dev/${RELEASE_PAGES_PATH_PREFIX}/"
          link_type: other
  rules:
    - if: "$CI_COMMIT_TAG"
